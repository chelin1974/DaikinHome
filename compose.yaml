# Plain Docker, without Kubernetes.
#
#   docker compose up -d
#   docker compose logs -f        # the HomeKit setup code is printed at startup
#
# Prometheus and Grafana for history are in compose.history.yaml.
#
# Settings come from the daikin.config.json next to this file - the same file the CLI reads,
# so there is nothing to write out twice. Copy daikin.config.example.json (Open API) or
# daikin.config.skyport.example.json (SkyportHome) to daikin.config.json and fill it in.
#
# Any single setting can still be overridden per-deployment with a DAIKIN_* environment
# variable, which wins over the file; that is how DAIKIN_DATA_DIRECTORY below puts every file
# the bridge writes on the volume, whatever the config file says.
#
services:
  daikin-home:
    build: .
    image: ghcr.io/chelin1974/daikin-home:latest
    container_name: daikin-home
    restart: unless-stopped

    # Required, not optional. HomeKit discovery is mDNS multicast on the local link, and
    # a container on Docker's bridge network can neither send nor receive it - the Home
    # app would simply never find the bridge. Host networking also means the REST API is
    # on the host's own port 8080, so there is no `ports:` mapping here.
    #
    # On Docker Desktop for Mac or Windows, host networking does not give you the real
    # LAN, so this will not work there. Run it on the Linux box that is on your network.
    network_mode: host

    environment:
      DAIKIN_CONFIG_FILE: /data/daikin.config.json
      # Every file the bridge writes goes here, on the bind mount below. Set explicitly rather
      # than left to default to the config file's directory, which is the read-only /config
      # mount - so this is what guarantees the pairing state is on the volume.
      DAIKIN_DATA_DIRECTORY: /data
      # Set this to the host's LAN IP if the Home app cannot find the bridge - the
      # auto-pick can choose an interface your iPhone cannot reach.
      # DAIKIN_BIND_ADDRESS: 192.168.7.10
      # Send readings to Prometheus from compose.history.yaml. Host networking means it is
      # on this machine's localhost.
      # DAIKIN_PROMETHEUS_URL: http://localhost:9090

    volumes:
      # HomeKit pairing state, on a bind mount rather than a named volume so it is an
      # ordinary file you can see, back up, and share with a run outside Docker. A named
      # volume kept it inside Docker's own storage, which meant a bridge already paired from
      # the command line looked brand new to the container, and the Home app was asked to
      # pair all over again. Losing this file un-pairs every controller.
      - ./data:/data

    # Tomcat insists on a writable temp dir and refuses to start without one: "Unable to
    # create tempDir. java.io.tmpdir is set to /tmp". On the container's writable layer that
    # is a disk write, so a full Docker disk stopped the bridge booting at all. In RAM it
    # cannot fill up with anything else, and the few KB Tomcat puts there are scratch - the
    # pairing state lives on the bind mount above, not here. The Kubernetes manifests mount an
    # emptyDir at /tmp for the same reason.
    tmpfs:
      - /tmp:size=64m

    healthcheck:
      # The JVM and HTTP listener only - deliberately not /actuator/health, which reports
      # DOWN during a Daikin cloud outage and would mark this container unhealthy over a
      # fault it cannot fix.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/liveness HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 4
