apiVersion: apps/v1
kind: Deployment
metadata:
  name: daikin-home
  labels:
    app.kubernetes.io/name: daikin-home
spec:
  # One, always. Two of these would both bind the HomeKit port, both advertise the same
  # bridge over mDNS, and both write the same pairing-state file. There is nothing to
  # gain from a second: the work is one slow poll of a cloud API.
  replicas: 1

  # Recreate, not RollingUpdate. A rolling update would start the new pod before the old
  # one exits, and it would fail to bind the HomeKit port on the host network and sit in
  # CrashLoopBackOff while the old pod kept serving. Recreate accepts a few seconds of
  # downtime instead, which for a thermostat bridge costs nothing.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: daikin-home

  template:
    metadata:
      labels:
        app.kubernetes.io/name: daikin-home
    spec:
      # THE reason this manifest looks the way it does.
      #
      # HomeKit discovery and resolution are mDNS: multicast to 224.0.0.251:5353 on the
      # local link. A pod on the cluster's overlay network cannot send or receive that,
      # so the Home app would never find the bridge, and a bridge that was already paired
      # would stop resolving and show every accessory as "No Response".
      #
      # hostNetwork puts the pod directly on the node's LAN interface, which is the only
      # way this works short of a macvlan/ipvlan CNI. The costs are real and worth knowing:
      # the container's ports are the node's ports (so nothing else on that node may use
      # 8080 or 51826), and the pod can reach anything the node can.
      hostNetwork: true

      # Without this, a hostNetwork pod inherits the node's resolv.conf and loses cluster
      # DNS - so it could not resolve, say, an in-cluster Prometheus by service name.
      dnsPolicy: ClusterFirstWithHostNet

      # The node must sit on the same LAN/VLAN as your Apple TV or HomePod; mDNS does not
      # cross subnets. Pin it:
      #   kubectl label node <node-name> homekit=true
      nodeSelector:
        homekit: "true"

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # So the mounted volume is writable by the non-root user.
        fsGroup: 10001

      terminationGracePeriodSeconds: 30

      containers:
        - name: daikin-home
          image: ghcr.io/chelin1974/daikin-home:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: homekit
              containerPort: 51826
              protocol: TCP

          env:
            # With hostNetwork this is the node's own LAN address, which is exactly what
            # HomeKit has to advertise. Left unset the bridge guesses from the available
            # interfaces and can pick one your iPhone cannot reach.
            - name: DAIKIN_BIND_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DAIKIN_STORAGE_PATH
              value: /data/daikin-home.state.json

          # Credentials. See secret.example.yaml.
          envFrom:
            - secretRef:
                name: daikin-home-credentials

          volumeMounts:
            - name: state
              mountPath: /data
            # readOnlyRootFilesystem is on, and the JVM and Tomcat both want a temp dir.
            - name: tmp
              mountPath: /tmp

          # Both probes use Spring's own liveness/readiness groups, which cover the JVM
          # and the HTTP listener. Neither uses /actuator/health: that includes the
          # daikinBridge indicator, which goes DOWN during a Daikin cloud outage, and a
          # probe on it would restart the pod in a loop over a fault outside the cluster.
          # /actuator/health is still the right thing for a human or Prometheus to watch.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            # Discovery reads every thermostat before publishing it, so first start is
            # slower than a restart. 30 x 5s = 150s before giving up.
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # No CPU limit on purpose: CFS throttling adds latency to the mDNS responder
              # and HomeKit is sensitive to a slow reply. Memory is capped; the image sets
              # -XX:MaxRAMPercentage=70, so the heap follows this number.
              memory: 768Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: daikin-home-state
        - name: tmp
          emptyDir: {}
