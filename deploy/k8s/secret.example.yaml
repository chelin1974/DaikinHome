# Template. Do NOT commit a filled-in copy of this file.
#
# Create the real Secret from the command line instead, so the values never touch git:
#
#   # SkyportHome accounts (email + password):
#   kubectl -n daikin-home create secret generic daikin-home-credentials \
#     --from-literal=DAIKIN_BACKEND=skyport \
#     --from-literal=DAIKIN_EMAIL='you@example.com' \
#     --from-literal=DAIKIN_PASSWORD='...'
#
#   # Integrator Open API accounts (API key + integrator token):
#   kubectl -n daikin-home create secret generic daikin-home-credentials \
#     --from-literal=DAIKIN_BACKEND=openapi \
#     --from-literal=DAIKIN_EMAIL='you@example.com' \
#     --from-literal=DAIKIN_API_KEY='...' \
#     --from-literal=DAIKIN_INTEGRATOR_TOKEN='...'
#
# The names are the environment variables Spring binds to daikin.* settings, so anything
# in application.yml can be overridden here the same way (DAIKIN_POLL_INTERVAL_SECONDS,
# DAIKIN_BRIDGE_NAME, DAIKIN_PROMETHEUS_URL, ...).
apiVersion: v1
kind: Secret
metadata:
  name: daikin-home-credentials
  labels:
    app.kubernetes.io/name: daikin-home
type: Opaque
stringData:
  DAIKIN_BACKEND: skyport
  DAIKIN_EMAIL: you@example.com
  DAIKIN_PASSWORD: CHANGE_ME
  # For the openapi backend instead:
  # DAIKIN_API_KEY: CHANGE_ME
  # DAIKIN_INTEGRATOR_TOKEN: CHANGE_ME
