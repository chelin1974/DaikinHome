daikin:
  # Which cloud to use. "skyport" for accounts on the SkyportHome app (email + password);
  # "openapi" for the integrator Open API (API key + integrator token). Left blank, a
  # password without an API key selects skyport. See the README.
  backend: ${DAIKIN_BACKEND:}
  email: ${DAIKIN_EMAIL:}
  # skyport backend
  password: ${DAIKIN_PASSWORD:}
  # openapi backend
  api-key: ${DAIKIN_API_KEY:}
  integrator-token: ${DAIKIN_INTEGRATOR_TOKEN:}

  # Daikin rate limits integrations that poll faster than this. Lower values are ignored.
  poll-interval-seconds: 180
  request-timeout-seconds: 20

  show-indoor-humidity: true
  show-outdoor-temperature-sensor: true

  bridge-name: Daikin One
  # The HomeKit accessory port, not the HTTP port below.
  homekit-port: 51826
  # LAN IP to advertise HomeKit on. Blank picks one; set it if the Home app can't find the bridge.
  bind-address: ${DAIKIN_BIND_ADDRESS:}
  # HomeKit pairing state. Back this file up; losing it un-pairs every controller.
  storage-path: daikin-home.state.json
  # Prometheus 3 base URL (started with --web.enable-otlp-receiver). Readings go to it as
  # OpenTelemetry metrics every metrics-interval-seconds. Blank sends none.
  prometheus-url: ${DAIKIN_PROMETHEUS_URL:}
  metrics-interval-seconds: 60

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      # Adds /actuator/health/liveness and /actuator/health/readiness. Spring enables
      # these automatically when it detects Kubernetes; setting it explicitly means the
      # same probe URLs work under Docker and on bare metal too.
      #
      # These groups cover the JVM and the HTTP listener only - not the daikinBridge
      # indicator. That is deliberate: /actuator/health reports DOWN while the Daikin
      # cloud is unreachable, so pointing a liveness probe at it would restart the
      # container in a loop every time Daikin has an outage, and pointing a readiness
      # probe at it would pull the REST API out of service exactly when you need it to
      # tell you what is wrong.
      probes:
        enabled: true

logging:
  level:
    io.github.chelin1974.daikinhome: INFO
    # HAP-Java logs every HomeKit frame at INFO, which buries everything else.
    io.github.hapjava: WARN
    io.netty: WARN
